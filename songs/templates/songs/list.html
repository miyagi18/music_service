{% extends "base.html" %}
{% block title %}Песни — Music Service{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-header__title">Песни</h1>
    <p class="page-header__meta">Всего: {{ songs|length }}</p>
</div>

{% if songs %}
    <div class="track-list">
        {% for song in songs %}
            {% include "songs/includes/song_card.html" %}
        {% endfor %}
    </div>
{% else %}
    <p class="empty">Песен пока нет.</p>
{% endif %}
{% endblock %}
