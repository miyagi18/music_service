{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Music Service{% endblock %}</title>
    <!-- Собственный CSS проекта -->
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
<div class="app">

    <!-- Навигация вынесена в отдельный шаблон -->
    {% include "includes/navigation.html" %}

    <!-- Основное содержимое страницы -->
    <main class="main">
        {% block content %}{% endblock %}
    </main>

</div>

<!-- Подвал сайта -->
<footer class="app-footer">
    <p>© <span id="current-year"></span> Music Service</p>
</footer>

<!-- Собственный JavaScript проекта -->
<script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
